name: Validate standalone app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate blackbody spectrum numerics
        run: node scripts/validate-blackbody.cjs
      - name: Smoke-test experiment models
        run: node scripts/validate-experiments.cjs
      - name: Validate experiment archive recovery
        run: node scripts/validate-storage-recovery.cjs
      - name: Validate archive capacity and explicit deletion
        run: node scripts/validate-archive-capacity.cjs
      - name: Validate readable typography and focus states
        run: node scripts/validate-readability.cjs
      - name: Parse embedded JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const html = fs.readFileSync('index.html', 'utf8') + '<script>' + fs.readFileSync('assets/js/legacy-app.js', 'utf8') + String.fromCharCode(60,47,115,99,114,105,112,116,62);
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)];
          const executable = scripts.filter(([, attrs]) => {
            const type = (attrs.match(/\btype=["']([^"']+)["']/i) || [])[1] || '';
            return !type || /^(module|text\/javascript|application\/javascript)$/i.test(type);
          });
          if (!executable.length) throw new Error('No inline executable JavaScript found');
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'inline-js-'));
          executable.forEach(([, , source], index) => {
            const file = path.join(dir, `script-${index + 1}.js`);
            fs.writeFileSync(file, source);
            execFileSync(process.execPath, ['--check', file], { stdio: 'inherit' });
          });
          console.log(`Syntax OK: ${executable.length} inline script(s)`);
          NODE
  browser-canvas:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the standalone lab
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/physchem-http.log 2>&1 &
          echo $! > /tmp/physchem-http.pid
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/physchem-http.log
          exit 1
      - name: Verify all 108 experiment drawings and mobile navigation
        run: node scripts/browser-smoke.cjs
      - name: Upload archive comparison desktop and mobile UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physchem-archive-comparison-ui
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
